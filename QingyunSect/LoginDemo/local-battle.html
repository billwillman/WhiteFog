<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青云宗 · 云端试剑</title>
<script>if(parent===window&&!location.search)location.replace('index.html?preview=battle');else if(parent!==window&&new URLSearchParams(location.search).has('standby'))document.documentElement.classList.add('battle-standby');</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#202733;color:#fff6e0;font:15px/1.5 system-ui,"Microsoft Yahei",sans-serif}main{position:relative;max-width:min(100vw,56.25vh);height:100vh;height:100dvh;margin:auto;overflow:hidden;background:#454e60}canvas{position:absolute;width:100%;height:100%;inset:0}#overlay{pointer-events:none}header,footer{position:absolute;left:5%;right:5%;text-shadow:0 1px 3px #222b34}header{top:3%;display:flex;justify-content:space-between;align-items:start}h1{font:600 1.2rem serif;margin:0}#health{font-variant-numeric:tabular-nums}footer{bottom:3%;display:grid;gap:.45rem;justify-items:start}button,summary{font:inherit;cursor:pointer;border:1px solid #b4aa93;background:#25303cea;color:#fff6e0;border-radius:.3rem;padding:.3rem .65rem}details{width:100%}details[open]{background:#222c38ed;padding:.4rem}ol{font-size:.82rem;margin:.4rem 0;max-height:28vh;overflow:auto;padding-left:1.8rem}#status{margin:0}body.embedded header{top:11%;left:4%;right:auto;font-size:clamp(12px,3vw,22px)}body.embedded header h1,body.embedded footer{display:none}body.failed footer{display:grid}.battle-standby #battle-transition{display:none}
</style><link rel="stylesheet" href="duel-hud.css"><link rel="stylesheet" href="battle-transition.css"></head><body><main><canvas id="field" aria-label="御剑战斗"></canvas><canvas id="overlay" aria-hidden="true"></canvas>

</div>
<header><h1 id="skill-name">云端试剑</h1><span id="health"></span></header><footer><p id="status" role="status">正在载入本地技能包…</p><button id="replay" hidden>再次试放</button><details><summary>施法记录</summary><ol id="events"></ol></details></footer>

  <div class="battle-transition-controls"><p role="status">正在载入本地技能包…</p><button type="button" hidden>取消</button></div>
</div>
</main>
