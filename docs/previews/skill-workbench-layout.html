   const rule=ruleFor(n.id);
   const select='<button type="button" class="action" data-selector="'+n.id+'" aria-pressed="'+(state.ruleOwner===n.id)+'">选择目标<small>拟议行为</small></button>';
   return '<div class="branch">'+select+'<div class="hint">'+describeRule(rule)+'</div><div class="branch"><small>找到目标 →</small> '+btn(n.id,'当前投射物续飞 <code>'+idtext(n)+'</code>','action')+'<div class="hint">再次接触 → 回到上方接触事件</div></div><div class="hint">无目标 → 本次续飞结束</div></div>';
 }
 if(n.k==="FormulaImpact")inner+='<div class="node-info"><small>受术者 · 本次实际受击者</small></div>';
 if(n.o.some(p=>p[0]==="BranchOutAction")){
 const children=output(n);inner+='<div class="node-info chips"><small class="cue">↳ '+event(n)+'</small>'+'</div>'+children.map(c=>'<div class="branch">'+childRow(c,visited)+'</div>').join("");
 if(!children.length)inner+='<small class="node-info">尚未接后续动作</small>';
 }
 return '<div class="branch">'+inner+'</div>';
}
function addButton(n){
 const exists=output(n).some(c=>c.draft);
 return '<button type="button" class="smallbtn" data-add="'+n.id+'">'+(exists?"移除示例 Buff":"＋ 接 Buff 示范")+'</button>';
}
function allTimes(){
 const list=output(node(0)).slice().sort((a,b)=>a.t-b.t||a.id-b.id);
 const group=(heading,items)=>'<div class="subhead">'+heading+'</div><div class="timelist">'+items.map(n=>btn(n.id,name(n)+'<small>'+n.t.toFixed(3)+' s · '+idtext(n)+'</small>',"rowbtn")).join("")+'</div>';
 return btn(0,"施法入口 · Node0","rowbtn")+group("施法后",list.filter(n=>![4,5].includes(n.stage)))+group("原作时间参考",list.filter(n=>[4,5].includes(n.stage)));
}
function flow(){
 const top=node(state.focus);
 if(!top)return "";
 let html='<small>时间轴选中来源</small>'+btn(top.id,(top.t===undefined?"":top.t.toFixed(3)+" s　")+name(top)+'<code>'+idtext(top)+'</code>',"action");
 if(top.k==="Combat")return html+'<div class="event">开始施法时</div>'+output(top).map(n=>btn(n.id,name(n)+' · '+n.t+' s',"rowbtn")).join("");
 if(!isSource(top))return html+'<div class="event">施法入口 → '+name(top)+'</div><small>右侧可查看此动作的实体输入、前置条件和参数。</small>';
 const children=output(top);
 return html+'<div class="event"><strong>↳ '+event(top)+'</strong></div>'+children.map(n=>childRow(n)).join("");
}
function ledger(){
 const groups=[["动作与触发",n=>n.k==="Combat"||isAction(n)],["条件与变量",n=>["EntityExist","Variable","BuffId"].includes(n.k)],["实体输入",n=>n.k==="Entity"]];
 return groups.map(([title,test])=>'<div class="subhead">'+title+'</div>'+nodes().filter(test).map(n=>{
 const lines=n.o.flatMap(([type,links],p)=>links.map(link=>{const [to,port]=link.split("#").map(Number),dest=node(to);return '<p>'+idtext(n)+'#'+p+' → '+btn(to,idtext(dest)+'#'+port+' · '+inputName(dest,port,dest.i[port][0]))+'</p>';}));
 return '<div class="linkset">'+jump(n)+' <code>'+n.k+'</code>'+lines.join("")+(!lines.length?"<p>无出线</p>":"")+'</div>';
 }).join("")).join("");
}
function opts(options,value){return options.map((o,i)=>'<option value="'+i+'"'+(i===value?" selected":"")+'>'+o+'</option>').join("");}
const field=(title,body)=>'<label class="field"><span>'+title+'</span>'+body+'</label>';
const fixed=(title,value)=>'<div class="field"><small>'+title+'</small><span>'+value+'</span></div>';
const setting=(key,label,list,v)=>field(label,'<select data-setting="'+key+'">'+opts(list,v)+'</select>');
const num=(key,label,v,step)=>field(label,'<input data-setting="'+key+'" type="number" min="0" step="'+step+'" value="'+v+'">');
function selectorInspector(owner){
 const rule=ruleFor(owner);
 const selectOptions=(names,index)=>opts(names,index);
 let h='<strong>选择目标</strong><div class="hint">拟议行为 · 每次上游事件触发时重新求值</div>';
 h+='<div class="detailgroup"><h3>候选范围</h3><select aria-label="候选范围" data-rule="pool">'+selectOptions(poolTypes,rule.pool)+'</select></div>';
 h+='<div class="detailgroup"><h3>筛选条件 <small>全部满足 · AND</small></h3>';
 rule.filters.forEach((f,i)=>{
  h+='<div class="ruleline"><select aria-label="条件 '+(i+1)+'" data-filter="'+i+'">'+selectOptions(filterTypes,f.type)+'</select><button type="button" class="smallbtn" data-remove-filter="'+i+'" aria-label="移除条件 '+(i+1)+'">移除</button></div>';
  if(f.type===2||f.type===3)h+=field(f.type===2?"范围（米）":"生命比例（%）",'<input aria-label="条件阈值" type="number" min="0" '+(f.type===3?'max="100"':'')+' step="any" data-threshold="'+i+'" value="'+f.value+'">');
 });
 if(rule.filters.length<filterTypes.length)h+='<button type="button" class="smallbtn" data-rule-button="filter">＋ 条件</button>';
 h+='</div><div class="detailgroup"><h3>排序 <small>排在最前的目标当选</small></h3>';
 rule.order.forEach((o,i)=>{
  h+='<div class="ruleline"><label><small>'+(i?"并列时再按":"优先按")+'</small><select aria-label="排序优先级 '+(i+1)+'" data-order="'+i+'">'+selectOptions(sortTypes,o)+'</select></label>'+(i?'<button type="button" class="smallbtn" data-remove-order="'+i+'">移除</button>':'')+'</div>';
 });
 if(rule.order.length<sortTypes.length)h+='<button type="button" class="smallbtn" data-rule-button="order">＋ 并列排序</button>';
 h+='</div><div class="detailgroup"><h3>输出</h3>'+fixed("找到","选中的实体 → 续飞的目标输入")+fixed("无目标","结束本次续飞")+'</div>';
 return h;
}
function inspector(){
 if(state.ruleOwner!==null)return selectorInspector(state.ruleOwner);
 const n=node(state.pick);const cfg=state.edits[state.skill+"-"+n.id]||{};
 let h='<strong>'+name(n)+'</strong><br><code>'+idtext(n)+' · '+n.k+'</code>';
 h+='<div class="detailgroup"><h3>输入连线与条件</h3>'+n.i.map(([type,links],port)=>{
 const info='<span class="ptype">'+inputName(n,port,type)+' · '+type+' #'+port+'</span>';
 const items=links.map(l=>jump(node(pin(l)))).join("");
 const rebind=type==="EntityIn"&&links.length?'<details><summary class="mut">改接实体输入</summary><select aria-label="选择输入节点" data-rewire="'+port+'">'+nodes().filter(a=>a.k==="Entity").map(a=>'<option value="'+a.id+'"'+(a.id===pin(links[0])?" selected":"")+'>'+idtext(a)+' · '+name(a)+'</option>').join("")+'</select></details>':"";
 return '<div class="portrow">'+info+(items||'<small>未连接</small>')+rebind+'</div>';
 }).join("")+(!n.i.length?'<small>无输入端口</small>':'')+'</div>';
 h+='<div class="detailgroup"><h3>节点参数</h3>';
 if(n.k==="RedirectProjectile"||isAction(n)){
 h+=num("t",n.k==="Projectile"||node(0).o[0][1].includes(n.id+"#0")?"施法后（秒）":"事件后延迟（秒）",n.t,.001)+setting("mode","执行方式",modes,cfg.mode||0);
 if(cfg.mode===1)h+=num("count","执行次数",cfg.count??2,1);if(cfg.mode===2)h+=num("duration","持续秒数",cfg.duration??1,.1);
 if(cfg.mode>0)h+=num("interval","执行间隔（秒）",cfg.interval??.1,.01);
 }
 if(n.k==="EntityExist")h+=setting("logic","判断逻辑",["存在","不存在","可交互"],cfg.logic??2);
 if(n.k==="Entity")h+=setting("entity","实体来源",Object.values(roles),[1,2,5].indexOf(n.v));
 if(n.k==="Combat")h+=fixed("施法目标上限",graph().limit);
 if(n.k==="Projectile")h+=fixed("投射物配置",graph().name+"-投射物")+fixed("继承初速","15 米/秒")+fixed("继承加速度","20 米/秒²");
 if(n.k==="Variable")h+=fixed("动态变量","skill.level")+fixed("默认值","1");
 if(n.k==="FormulaImpact")h+=fixed("命中方式","直接结算")+fixed("流程资产","宗师之上实战属性伤害")+fixed("逻辑段号",n.logicIndex||1);
 if(n.k==="OverTimeEffect")h+=fixed("操作","施加状态")+fixed("状态","中毒 · poison");
 if(n.k==="BuffId")h+=fixed("值","poison 的状态 ID");
 if(n.k==="OriginalSkillVisual")h+=fixed("表现类型",name(n))+(n.bone?fixed("挂点",n.bone):"");
 if(n.k==="Animation")h+=fixed("动作来源","技能动作绑定");
 h+='</div><div class="detailgroup"><h3>输出与后续动作</h3>';
 for(const [type,links] of n.o){h+='<div class="portrow"><span class="ptype">'+type+'</span>'+links.map(l=>jump(node(pin(l)))).join("")+(links.length?"":"<small>未连接</small>")+'</div>';}
 if(!n.o.length)h+='<small>无输出端口</small>';
 if(n.k==="FormulaImpact"||isSource(n))h+=addButton(n);
 return h+'</div>';
}
const exampleLogs=[
 ["接触甲，结算甲的伤害，飞剑转向乙。","接触乙，结算乙的伤害，同一把剑转向丙。","接触丙，结算丙的伤害，名单结束，飞行结束。"],
 source[1].nodes.filter(n=>n.k==="OriginalSkillVisual"&&n.o.some(p=>p[1].length)).map(n=>{
   const damage=source[1].nodes.find(d=>d.id===pin(n.o[0][1][0]));
   return n.t.toFixed(3)+" 秒的特效（"+idtext(n)+"）接触目标，触发"+name(damage)+"（"+idtext(damage)+"）。";
 })
];
function render(){
 $("skill").value=state.skill;$("meta").textContent="原图 "+source[state.skill].nodes.length+" 个 MCC 节点　·　施法目标上限 "+graph().limit;
 $("timeline").innerHTML=allTimes();
 root.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===state.view));
 $("canvas").innerHTML=state.view==="ports"?ledger():flow();
 $("inspector").innerHTML=inspector();
 const trace = $("trace");
 trace.replaceChildren();
 for(const entry of exampleLogs[state.skill]){
   const row=document.createElement("li");
   row.textContent=entry;
   trace.appendChild(row);
 }
}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{skill:graph().name,view:state.view,selected:state.ruleOwner===null?"Node"+state.pick:"选择目标（拟议）"},privateContent:{skill:state.skill,view:state.view,pick:state.pick,focus:state.focus,ruleOwner:state.ruleOwner,rules:selectorDrafts}}).catch(()=>{});}
function contextOf(n){
 if(n.k==="Combat"||node(0).o[0][1].includes(n.id+"#0"))return n;
 const q=[n];const seen=new Set();
 while(q.length){const cur=q.shift();if(seen.has(cur.id))continue;seen.add(cur.id);
 if(isSource(cur))return cur;
 for(const p of cur.i.filter(p=>p[0]==="ActionIn"))for(const l of p[1])q.push(node(pin(l)));
 for(const d of receiverOf(cur))if(!seen.has(d.id))q.push(d);
 }return null;
}
function choose(id){const n=node(id);if(!n)return;state.ruleOwner=null;state.pick=n.id;const scope=contextOf(n);if(scope)state.focus=scope.id;}
function flipBuff(parent){
 const child=output(parent).find(c=>c.draft);
 if(child){parent.o[0][1]=parent.o[0][1].filter(x=>pin(x)!==child.id);const removed=new Set([child.id,...child.i.slice(1).flatMap(p=>p[1].map(pin))]);graph().nodes=nodes().filter(n=>!removed.has(n.id));choose(parent.id);return;}
 const id=Math.max(...nodes().map(n=>n.id))+1;
 const b={id,k:"OverTimeEffect",draft:true,t:0,i:[["ActionIn",[parent.id+"#0"]],["EntityIn",[(id+1)+"#0"]],["CustomVariable",[(id+2)+"#0"]],["ConditionIn",[]]],o:[]};
 nodes().push(b,{id:id+1,k:"Entity",draft:true,v:2,i:[],o:[["EntityOut",[id+"#1"]]]},{id:id+2,k:"BuffId",draft:true,i:[],o:[["Variable",[id+"#2"]]]});
 parent.o[0][1].push(id+"#0");choose(id);
}
root.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.node!==undefined)choose(+b.dataset.node);
 else if(b.dataset.view){state.view=b.dataset.view;if(state.view==="ports")state.ruleOwner=null;}
 else if(b.dataset.selector!==undefined){choose(+b.dataset.selector);state.ruleOwner=state.pick;}
 else if(state.ruleOwner!==null&&(b.dataset.ruleButton||b.dataset.removeFilter!==undefined||b.dataset.removeOrder!==undefined)){
  const rule=ruleFor(state.ruleOwner);
  if(b.dataset.ruleButton==="filter"){
   const type=filterTypes.findIndex((_,i)=>!rule.filters.some(f=>f.type===i));
   if(type!==-1)rule.filters.push({type:type,value:type===3?50:8});
  }else if(b.dataset.ruleButton==="order"){
   const index=sortTypes.findIndex((_,i)=>!rule.order.includes(i));if(index!==-1)rule.order.push(index);
  }else if(b.dataset.removeFilter!==undefined)rule.filters.splice(+b.dataset.removeFilter,1);
  else if(+b.dataset.removeOrder>0)rule.order.splice(+b.dataset.removeOrder,1);
 }
 else if(b.dataset.add!==undefined)flipBuff(node(+b.dataset.add));
 render();save();
});
root.addEventListener("change",e=>{
 const el=e.target,n=node(state.pick);
 if(el===$("skill")){state.skill=+el.value;state.view="events";choose(state.skill?sources()[0].id:nodes().find(a=>a.k==="RedirectProjectile").id);}
 else if(state.ruleOwner!==null&&(el.dataset.rule||el.dataset.filter!==undefined||el.dataset.order!==undefined||el.dataset.threshold!==undefined)){
  const rule=ruleFor(state.ruleOwner),v=Number(el.value);
  if(el.dataset.rule==="pool")rule.pool=v;
  else if(el.dataset.filter!==undefined){
   const f=rule.filters[+el.dataset.filter],duplicate=rule.filters.find(other=>other!==f&&other.type===v);
   if(duplicate){duplicate.type=f.type;duplicate.value=f.value;}
   f.type=v;f.value=v===3?50:8;
  }else if(el.dataset.threshold!==undefined){
   const f=rule.filters[+el.dataset.threshold];f.value=Math.max(0,f.type===3?Math.min(100,v):v);
  }else{const i=+el.dataset.order,used=rule.order.indexOf(v);if(used>=0)rule.order[used]=rule.order[i];rule.order[i]=v;}
 }
 else if(el.dataset.rewire!==undefined){const port=+el.dataset.rewire,ref=n.id+"#"+port,prev=node(pin(n.i[port][1][0])),replacement=node(+el.value);prev.o[0][1]=prev.o[0][1].filter(x=>x!==ref);replacement.o[0][1].push(ref);n.i[port][1]=[replacement.id+"#0"];}
 else if(el.dataset.setting){const k=el.dataset.setting;let v=Math.max(0,Number(el.value)||0);if(k==="count")v=Math.max(1,Math.round(v));if(k==="t")n.t=v;else if(k==="entity")n.v=[1,2,5][v];else (state.edits[state.skill+"-"+n.id]??={})[k]=v;}
 render();save();
});
function restore(s){
 if(!s||![0,1].includes(s.skill))return;
 state.skill=s.skill;state.view=s.view==="ports"?"ports":"events";
 state.focus=node(s.focus)?.id??sources()[0].id;state.pick=node(s.pick)?.id??state.focus;
 state.ruleOwner=state.view==="events"&&node(s.ruleOwner)?.k==="RedirectProjectile"?s.ruleOwner:null;
 for(const [key,value] of Object.entries(s.rules||{})){
   if(!/^\d+\/\d+$/.test(key)||!value||!poolTypes[value.pool]||!Array.isArray(value.filters)||!Array.isArray(value.order))continue;
   if(value.filters.some(f=>!f||!filterTypes[f.type]||(f.type>=2&&!Number.isFinite(f.value))))continue;
   if(!value.order.length||value.order.some(i=>!sortTypes[i]))continue;
   selectorDrafts[key]=JSON.parse(JSON.stringify(value));
 }
}
restore(window.openai?.widgetState?.privateContent);window.addEventListener("openai:set_globals",e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s){restore(s);render();}});render();
})();

</script>
